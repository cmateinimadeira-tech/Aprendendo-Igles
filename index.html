<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprendendo Inglês</title>
<style>
  :root { --bg:#f7f7f4; --fg:#1d1d1b; --card:#fff; --accent:#c8102e; --muted:#6b6b66; --ok:#1d8a4a; --bad:#c23b3b; --line:#e2e2dc; --eng:#eef2fb; --drv:#fbf0ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --fg:#ececea; --card:#222226; --accent:#ff5a6e; --muted:#9a9a95; --ok:#4cc27f; --bad:#ef7676; --line:#35353a; --eng:#262c3a; --drv:#3a2826; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 system-ui,sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:2; }
  header .in, main { max-width:700px; margin:0 auto; padding:0 16px; }
  header .in { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-top:10px; padding-bottom:10px; }
  header b { font-size:1.05rem; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav a { color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:8px; font-size:.92rem; }
  nav a.on { color:var(--fg); background:var(--card); border:1px solid var(--line); }
  main { padding-top:16px; padding-bottom:64px; }
  h2 { margin:.3em 0; } h3 { margin:.2em 0 .5em; }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:14px 0; color:inherit; text-decoration:none; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .locked { opacity:.5; }
  .tag { font-size:.9rem; white-space:nowrap; }
  .muted { color:var(--muted); font-size:.92rem; }
  .btn, button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:10px 14px; display:inline-block; text-decoration:none; margin-top:8px; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .bad-b { border-color:var(--bad); color:var(--bad); }
  button.link { border:0; background:none; color:var(--muted); text-decoration:underline; padding:0; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--accent); }
  .level { font-size:2.2rem; font-weight:700; color:var(--accent); }
  .radio p { margin:8px 0; padding:10px 12px; border-radius:10px; }
  .radio b { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .radio .eng { background:var(--eng); margin-right:12%; }
  .radio .drv { background:var(--drv); margin-left:12%; }
  .prose { font-size:1.08rem; }
  .w { text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer; }
  .gloss { min-height:1.5em; }
  fieldset.q { border:1px solid var(--line); border-radius:10px; margin:10px 0; padding:10px 12px; }
  fieldset.q legend { font-weight:600; padding:0 4px; }
  fieldset.q label { display:block; padding:4px 0; cursor:pointer; }
  fieldset.right { border-color:var(--ok); } fieldset.wrong { border-color:var(--bad); }
  .why { font-size:.92rem; margin:6px 0 0; }
  .right .why { color:var(--ok); } .wrong .why { color:var(--bad); }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); }
  details summary { cursor:pointer; }
  table { width:100%; border-collapse:collapse; }
  td { padding:7px 8px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  textarea { width:100%; font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .center { text-align:center; }
  .big { font-size:2rem; font-weight:700; margin:.3em 0; } .big2 { font-size:1.3rem; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .chip { margin:0; padding:6px 12px; border-radius:99px; font-size:.9rem; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .lvh { margin-top:22px; }
  .qt { display:inline-block; font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin-bottom:4px; }
  .cefr { font-size:.8rem; font-weight:600; color:var(--muted); }
  .strat { background:var(--eng); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:.95rem; }
  .lined { font-family: Georgia, "Times New Roman", serif; font-size:1rem; line-height:1.6; }
  .lined .ln { display:grid; grid-template-columns:2.2em 1fr; }
  .lined .ln i { font-style:normal; color:var(--muted); font-size:.75rem; text-align:right; padding-right:.7em; padding-top:.2em; }
  .lined .ln > span { padding-left:1em; text-indent:-1em; }
  .lined .ln.ind > span { padding-left:0; text-indent:1.5em; }
  .lined .ln i.five { color:var(--fg); font-weight:700; }
  @media (max-width:600px) { .lined { font-size:.92rem; } .lined .ln { margin-bottom:3px; } }
  .lined .src { font-size:.85rem; color:var(--muted); margin-top:10px; }
  .qpt { display:block; font-size:.88rem; color:var(--muted); font-weight:400; }
  body:not(.show-pt) .qpt { display:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<header><div class="in">
  <b>Aprendendo Inglês</b>
  <nav>
    <a href="#inicio">Início</a>
    <a href="#licoes">Lições</a>
    <a href="#revisao">Revisão</a>
    <a href="#guia">Guia</a>
    <a href="#glossario">Rádio F1</a>
  </nav>
</div></header>
<main id="view"></main>
<script src="data.js"></script>
<script src="anpad.js"></script>
<script src="app.js"></script>
</body>
</html>
