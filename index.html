<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Aprendendo Inglês</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
  /* Layout: app de uma coluna para smartphone, cabeçalho fino no topo e
     barra de abas fixa embaixo, ao alcance do polegar. */
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --ink: #15181d; --muted: #5d6470; --line: #dfe2e7;
    --accent: #d0142c; --on-accent: #ffffff; --ok: #1a7f45; --bad: #c0303a;
    --eng: #e9eef8; --drv: #f8ecec; --soft: #eef0f3;
    --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-read: "Literata", Georgia, "Times New Roman", serif;
    --tabbar: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --surface: #1b1e24; --ink: #e9ebef; --muted: #9aa1ad; --line: #2c3038;
      --accent: #ff4d61; --on-accent: #16080a; --ok: #4cc27f; --bad: #ff7a7a;
      --eng: #1f2737; --drv: #33222a; --soft: #23262d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121418; --surface: #1b1e24; --ink: #e9ebef; --muted: #9aa1ad; --line: #2c3038;
    --accent: #ff4d61; --on-accent: #16080a; --ok: #4cc27f; --bad: #ff7a7a;
    --eng: #1f2737; --drv: #33222a; --soft: #23262d; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font-ui); -webkit-tap-highlight-color: transparent; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
  .brand { font-weight: 700; letter-spacing: .01em; }
  .brand span { color: var(--accent); }
  .sync { font-size: .78rem; color: var(--muted); white-space: nowrap; }

  main { max-width: 680px; margin: 0 auto; padding-block: 12px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom, 0px));
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Barra de abas inferior */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
          padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar); }
  .tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: .72rem; position: relative; }
  .tabs a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs a.on { color: var(--accent); font-weight: 700; }
  .tabs .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: .68rem; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

  h2 { font-size: 1.45rem; line-height: 1.25; margin: .4em 0 .2em; text-wrap: balance; }
  h3 { font-size: 1.1rem; margin: 0 0 .5em; text-wrap: balance; }
  p { margin: .5em 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .9rem; }
  .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; color: inherit; text-decoration: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
  .row > span:first-child { min-width: 0; }
  .locked { opacity: .5; }
  .tag { font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .btn, button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
                 padding: 12px 16px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 8px; touch-action: manipulation; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  .btn.block { display: flex; width: 100%; }
  .bad-b { border-color: var(--bad); color: var(--bad); }
  button.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 8px 0; min-height: 0; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; }
  .level { font-size: 2.2rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .cefr { font-size: .8rem; font-weight: 700; color: var(--muted); }

  /* Textos de leitura */
  .radio p { margin: 8px 0; padding: 10px 12px; border-radius: 14px; font-family: var(--font-read); font-size: 1.05rem; line-height: 1.5; }
  .radio b { display: block; font-family: var(--font-ui); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .radio .eng { background: var(--eng); margin-right: 10%; border-bottom-left-radius: 4px; }
  .radio .drv { background: var(--drv); margin-left: 10%; border-bottom-right-radius: 4px; }
  .prose { font-family: var(--font-read); font-size: 1.1rem; line-height: 1.65; }
  .w { text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; }
  .w.seen { text-decoration-color: var(--accent); }
  .lined { font-family: var(--font-read); font-size: 1rem; line-height: 1.6; }
  .lined .ln { display: grid; grid-template-columns: 2em minmax(0, 1fr); margin-bottom: 4px; }
  .lined .ln i { font-style: normal; font-family: var(--font-ui); color: var(--muted); font-size: .72rem; text-align: right; padding-right: .7em; padding-top: .25em; font-variant-numeric: tabular-nums; }
  .lined .ln i.five { color: var(--ink); font-weight: 700; }
  .lined .ln > span { padding-left: 1em; text-indent: -1em; }
  .lined .ln.ind > span { padding-left: 0; text-indent: 1.5em; }
  .lined .src { font-family: var(--font-ui); font-size: .82rem; color: var(--muted); margin-top: 10px; }

  /* Perguntas: alternativas como cartões grandes */
  fieldset.q { border: 0; margin: 18px 0; padding: 0; min-width: 0; }
  fieldset.q legend { font-weight: 700; padding: 0; margin-bottom: 6px; }
  .qpt { display: block; font-size: .88rem; color: var(--muted); font-weight: 400; }
  body:not(.show-pt) .qpt { display: none; }
  .qt { display: inline-block; font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; margin: 0 0 8px; min-height: 0; background: transparent; }
  .qtip { font-size: .85rem; color: var(--muted); margin: -4px 0 8px; }
  fieldset.q label { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; margin: 6px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; min-height: 48px; }
  fieldset.q label input { margin: 4px 0 0; width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
  fieldset.q label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  fieldset.right label:has(input:checked) { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
  fieldset.wrong label:has(input:checked) { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
  .why { font-size: .92rem; margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--soft); }
  .right .why { color: var(--ok); } .wrong .why { color: var(--bad); }
  .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); }

  details summary { cursor: pointer; padding-block: 10px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  textarea { width: 100%; font: inherit; font-size: 1rem; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .center { text-align: center; }
  .big { font-size: 2rem; font-weight: 700; margin: .3em 0; font-family: var(--font-read); } .big2 { font-size: 1.3rem; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; margin: 0 -4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { margin: 0; padding: 8px 14px; border-radius: 99px; font-size: .9rem; white-space: nowrap; min-height: 40px; flex: none; }
  .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .lvh { margin-top: 22px; }
  .strat { background: var(--eng); border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: .95rem; }

  /* Faixa do significado da palavra, acima da barra de abas */
  .sheet { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px)); z-index: 7;
           padding: 0 max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  .sheet div { max-width: 656px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 1rem;
               box-shadow: 0 6px 24px rgba(0,0,0,.25); pointer-events: auto; transform: translateY(0); transition: transform .2s, opacity .2s; }
  .sheet[hidden] { display: block !important; }
  .sheet[hidden] div { transform: translateY(20px); opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .sheet div { transition: none; } }
  fieldset.q label.dunno { border-style: dashed; color: var(--muted); }
  .sure { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--soft); }
  .sure .duo { margin-top: 6px; }
  fieldset.q .sure label { margin: 0; font-size: .92rem; }
  .timing { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
  .timing p { margin: .3em 0; }
  .flu { font-weight: 700; }
  .flu.fluente { color: var(--ok); } .flu.dev { color: var(--ink); } .flu.lenta { color: var(--bad); }
  .fab { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom, 0px));
         margin: 0; border-radius: 99px; background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .textsheet { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  .ts-in { width: 100%; max-width: 680px; margin: 0 auto; max-height: 82%; display: flex; flex-direction: column; background: var(--surface);
           border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .ts-head { display: flex; justify-content: space-between; align-items: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
  .ts-head button { margin: 0; }
  .ts-body { overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }
  .backup textarea { font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
  .install-steps li { margin: .3em 0; }
  .topr { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .fsbtn { margin: 0; min-height: 40px; min-width: 40px; padding: 0 10px; font-size: 1.1rem; line-height: 1; border-radius: 10px; }
  /* Tela cheia: sem barra de status não é preciso reservar a faixa do topo.
     O cabeçalho sobe até a borda; o nome fica à esquerda e o botão à direita,
     longe da câmera frontal no centro; o aviso de salvamento é ocultado. */
  html.fs body::before { display: none; }
  html.fs .top { top: 0; }
  html.fs .sync { display: none; }
  html.fs .top .in { min-height: 38px; }
  html.fs .brand { font-size: .95rem; }
  html.fs .fsbtn { min-height: 32px; min-width: 32px; font-size: .95rem; }
  .top { transition: transform .2s ease; }
  html.fs .top.away { transform: translateY(-100%); }
  @media (prefers-reduced-motion: reduce) { .top { transition: none; } }
  .probe { position: fixed; top: 0; left: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
  .diag { font-size: .72rem; }
  .today { display: block; }
  .today-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .streak { font-weight: 700; font-size: 1.15rem; color: var(--muted); }
  .streak.on { color: var(--accent); }
  .xp { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mini { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); align-items: center; gap: 10px; font-size: .88rem; }
  .mini .bar { margin: 6px 0; }
  .xpgain { font-weight: 700; color: var(--accent); font-size: 1.1rem; margin: 10px 0 0; }
  .field { display: grid; gap: 4px; margin: 10px 0; font-size: .9rem; color: var(--muted); }
  .field select, .field input { font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 46px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .wday { display: grid; gap: 2px; padding: 8px 0; border-radius: 10px; background: var(--soft); font-variant-numeric: tabular-nums; font-size: .8rem; }
  .wday b { font-size: 1.1rem; }
  .wday.met { background: var(--accent); color: var(--on-accent); }
  .wday.met .muted { color: var(--on-accent); opacity: .85; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .badge { display: grid; gap: 2px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line); opacity: .55; font-size: .85rem; }
  .badge .bi { font-size: 1.5rem; filter: grayscale(1); }
  .badge.got { opacity: 1; border-style: solid; border-color: var(--accent); }
  .badge.got .bi { filter: none; }
  .w.lk { text-decoration-style: solid; text-decoration-color: var(--accent); }
  .wchip { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); margin-top: 2px; }
  .wchip.p1 { background: var(--drv); color: var(--accent); font-weight: 700; }
  tr.easy td { opacity: .5; }
  .blank { letter-spacing: .1em; color: var(--accent); font-weight: 700; }
  mark { background: var(--drv); color: var(--ink); padding: 0 3px; border-radius: 4px; font-weight: 700; }
  .wordcard { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--eng); }
  .wordcard p { margin: .3em 0 0; }
  .missions { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 4px; font-size: .92rem; }
  .missions li.ok { color: var(--muted); text-decoration: line-through; }
  .duo4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .duo4 .btn { padding: 10px 4px; }
  .hidden { display: none; }
</style>
<!-- ARTIFACT-HEAD-END -->
</head>
<body>
<header class="top"><div class="in">
  <span class="brand">Aprendendo <span>Inglês</span></span>
  <span class="topr"><span class="sync" id="sync"></span><button type="button" class="fsbtn" id="fsBtn" hidden aria-label="Tela cheia">⛶</button></span>
</div></header>
<div class="probe" id="probe"></div>
<main id="view"></main>
<div class="sheet" id="sheet" hidden><div id="sheetText" role="status"></div></div>
<button class="fab" id="textFab" type="button" hidden>📄 Ver texto</button>
<div class="textsheet" id="textSheet" hidden role="dialog" aria-label="Texto da lição">
  <div class="ts-in">
    <div class="ts-head"><b>Texto</b><button type="button" id="textSheetClose">Fechar</button></div>
    <div class="ts-body" id="textSheetBody"></div>
  </div>
</div>
<nav class="tabs" aria-label="Navegação"><div class="in">
  <a href="#inicio" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
  <a href="#licoes" data-tab="licoes"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h7"/></svg>Lições</a>
  <a href="#leitura" data-tab="leitura"><svg viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>Leitura</a>
  <a href="#revisao" data-tab="revisao"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Revisão<span class="badge" id="dueBadge" hidden></span></a>

  <a href="#metas" data-tab="metas"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg>Metas</a>
</div></nav>
